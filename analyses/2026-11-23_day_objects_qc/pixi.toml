[workspace]
name = "day-objects-qc"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.13.*"

# The notebooks' PEP 723 headers pin the same versions: change them together.
[pypi-dependencies]
anndata = "==0.13.4"
crispr-analysis-utils = { git = "https://github.com/EngreitzLab/crispr-analysis-utils", rev = "6e75a186e32ebcf479b8fc5d4440ea8610848c7d" }
h5py = ">=3.12.0"
jupyter-scatter = "==1.0.1"
marimo = ">=0.25.2"
matplotlib = "==3.11.2"
mudata = "==0.4.1"
numpy = "==2.5.5"
pandas = "==3.1.1"
pysceptre = { version = "==0.6.0", extras = ["fast", "io"] }
scipy = "==1.18.1"

[tasks]
# --no-sandbox: use this environment, not the uv one the PEP 723 header describes.
# Name the notebook after the task: `pixi run edit day0_qc.py`.
edit = "marimo edit --no-sandbox"
